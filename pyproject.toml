[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "polymind-constellation"
version = "0.8.1"
description = "Provider-neutral Agent Skills authoring and validation framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
polymind = "polymind.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.16.0,<1",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polymind"]

[tool.hatch.build.targets.wheel.force-include]
"dist/repo" = "polymind/_projection"

[tool.hatch.build.targets.sdist.force-include]
"dist/repo" = "dist/repo"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
