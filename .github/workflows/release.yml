name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install checksum-pinned Gitsign
        env:
          GITSIGN_URL: https://github.com/sigstore/gitsign/releases/download/v0.16.1/gitsign_0.16.1_linux_amd64
          GITSIGN_SHA256: 4a29a1f4b9add1f0f6d9a3e9e6ba0cffa121b971be82d62bb1496d7d1d877b0a
        run: |
          curl --fail --silent --show-error --location "${GITSIGN_URL}" --output "${RUNNER_TEMP}/gitsign"
          echo "${GITSIGN_SHA256}  ${RUNNER_TEMP}/gitsign" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/gitsign"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Verify source
        run: scripts/verify
      - name: Build wheel and source archive
        run: uv build
      - name: Generate release evidence
        env:
          RELEASE_COMMIT_IDENTITY: ${{ vars.RELEASE_COMMIT_IDENTITY }}
          RELEASE_COMMIT_OIDC_ISSUER: ${{ vars.RELEASE_COMMIT_OIDC_ISSUER }}
        run: >-
          uv run polymind release-manifest
          --repository "${GITHUB_REPOSITORY}"
          --commit "${GITHUB_SHA}"
          --ref "${GITHUB_REF}"
          --commit-identity "${RELEASE_COMMIT_IDENTITY}"
          --commit-issuer "${RELEASE_COMMIT_OIDC_ISSUER}"
      - name: Generate signed SLSA build provenance
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Materialize the generated Sigstore bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/release-attestation.sigstore.json
      - name: Verify tag, commit, artifacts, and Sigstore identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_IDENTITY: ${{ vars.RELEASE_COMMIT_IDENTITY }}
          RELEASE_COMMIT_OIDC_ISSUER: ${{ vars.RELEASE_COMMIT_OIDC_ISSUER }}
        run: >-
          scripts/verify --release
          --commit-identity "${RELEASE_COMMIT_IDENTITY}"
          --commit-issuer "${RELEASE_COMMIT_OIDC_ISSUER}"
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: |
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
            dist/release-manifest.json
            dist/release-attestation.sigstore.json
          if-no-files-found: error
          retention-days: 30

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/polymind-constellation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-dists
          path: dist
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          print-hash: true

  github-release:
    needs:
      - build
      - pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-dists
          path: dist
      - name: Download release evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-evidence
          path: evidence
      - name: Create immutable-tag GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/* evidence/*
          --verify-tag
          --title "Polymind Constellation ${GITHUB_REF_NAME}"
          --notes-file evidence/RELEASE_NOTES.md
